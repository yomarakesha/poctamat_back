        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/audit-log:
    get:
      tags: [Admin — audit log]
      operationId: adminListAuditLog
      summary: Audit log
      description: |
        Append-only. Every admin action, every staff action on a terminal, every wrong
        PIN and every system event. Cursor pagination — this table only grows.

        Retention: one year in the hot table, older entries move to cold storage and
        are reachable through the CSV export rather than through this endpoint. A query
        whose range starts before the hot window answers with what it has and sets
        `pagination.truncated_at`.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: source
          in: query
          description: 'Comma-separated: `system`, `admin`, `staff`, `device`, `api`.'
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          description: Comma-separated list of `AuditEventType`.
          schema:
            type: string
        - name: postamat_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cell_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: to
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Log entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/audit-log/export:
    get:
      tags: [Admin — audit log]
      operationId: adminExportAuditLog
      summary: Stream the audit log as CSV
      description: |
        Streamed from the server with `Transfer-Encoding: chunked`. The browser must
        never assemble this itself — the log can run to millions of rows and the tab
        would die trying.

        Same filters as the list endpoint. UTF-8 with BOM so Excel opens it correctly.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: from
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: to
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: postamat_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV stream.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="audit-log-2026-08-14.csv"
          content:
            text/csv:
              schema:
                type: string
        '422':
          description: |
            Codes: `EXPORT_TOO_LARGE` — narrow the date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


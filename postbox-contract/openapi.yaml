              required: [parcel_fate]
              properties:
                parcel_fate:
                  type: string
                  enum: [collected, moved_to_counter, cell_was_empty, returned_to_sender]
                  description: The answer to «посылку забрали?».
                note:
                  type: [string, 'null']
                  maxLength: 500

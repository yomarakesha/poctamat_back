      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: |
            A one-time password the operator reads to the person. It expires and must
            be changed on first use.
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password, expires_at]
                properties:
                  temporary_password:
                    type: string
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
        '403':
          description: 'Codes: `CANNOT_MODIFY_SELF`, `FORBIDDEN`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '400':

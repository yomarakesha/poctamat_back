  /admin/realtime/stream:
    get:
      tags: [Realtime]
      operationId: adminRealtimeStream
      summary: Server-sent events for the monitor
      description: |
        The admin panel starts on 5-second polling; this endpoint is the upgrade path,
        which is why the data source is abstracted behind an interface on the client.

        `text/event-stream`. Each event has a `type` from `RealtimeEventType` and a JSON
        payload. Clients must tolerate unknown types — new ones will be added without a
        version bump.
      security:
        - adminAuth: []
      parameters:
        - name: postamat_id
          in: query
          description: Subscribe to one postamat instead of the whole fleet.
          schema:
            type: string
            format: uuid
        - name: last_event_id
          in: query
          description: Resume after a dropped connection.
          schema:
            type: string
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:

  securitySchemes:
    clientAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Client access token, 15 minutes. Renew with `/auth/refresh`.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token, 15 minutes. Renew with `/admin/auth/refresh`.
    deviceAuth:
      type: http
      scheme: bearer
      description: |
        Long-lived device token obtained at provisioning. Kept in the device keystore.
    staffAuth:
      type: http
      scheme: bearer
      description: Staff-mode token on a terminal. Short-lived, dies with inactivity.

  parameters:

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated UUID. Replaying the same key with the same body returns the
        original response instead of acting twice.
      schema:
        type: string
        format: uuid

    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Mandatory on every state-changing POST. A retry over a flaky connection must
        not book two cells or send two SMS.
      schema:
        type: string
        format: uuid

    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: '`tk`, `ru` or `en`. Affects human-readable names, never error codes.'
      schema:
        $ref: '#/components/schemas/Language'

    Page:
      name: page
      in: query
      description: Page number, 1-based. Reference data only.
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous response. Feeds and logs only.
      schema:
        type: string

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Sort:
      name: sort
      in: query
      description: 'Field name, `-` prefix for descending. Example: `-created_at`.'
      schema:
        type: string
        example: -created_at

    Query:
      name: q
      in: query
      description: Free-text search. Scope depends on the endpoint.
      schema:
        type: string
        maxLength: 200

    PostamatId:
      name: postamat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CellId:
      name: cell_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CustodyId:
      name: custody_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    KioskSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:

    BadRequest:
      description: |
        Malformed request. Codes: `VALIDATION_ERROR`, `IDEMPOTENCY_KEY_MISSING`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request body failed validation.
              details:
                fields:
                  phone: must match E.164 (+993…)
              trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4eff

    IdempotencyConflict:
      description: |
        The same `Idempotency-Key` arrived again with a different body. Code:
        `IDEMPOTENCY_KEY_REUSED`. Replaying a key with the *same* body is not an
        error — it returns the original response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: |
        No or expired credentials. Codes: `UNAUTHORIZED`, `TOKEN_EXPIRED`,
        `TOKEN_INVALID`. **401 means refresh the token — never confuse it with 403.**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: |
        Authenticated but not permitted. Codes: `FORBIDDEN`. **Refreshing will not help.**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 'Codes: `NOT_FOUND`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: 'Codes: `VALIDATION_ERROR` and endpoint-specific business rules.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: |
        Codes: `INTERNAL_ERROR`. `trace_id` is what to quote when reporting it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── primitives ────────────────────────────────────────────────────────

    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO-8601 with `Z`. Rendered in `Asia/Ashgabat` by clients.
      example: '2026-08-14T09:41:00Z'

    Phone:
      type: string
      pattern: '^\+993[0-9]{8}$'
      description: E.164. Turkmenistan only for now.
      example: '+99365123456'

    Pin:
      type: string
      pattern: '^[0-9]{5}$'
      description: |
        One-time cell code, 5 digits. Distinct from the 6-digit login OTP.
        Never logged, never pushed, never echoed back once used.
      example: '45865'

    Language:
      type: string
      enum: [tk, ru, en]
      description: |
        Turkmen is the default: it is preselected on first launch and it is what a
        kiosk falls back to when a session ends. Expressed in prose rather than as
        a schema `default` because code generators emit uncompilable Dart for an
        enum default.

    Money:
      type: object
      description: |
        Integer minor units plus a currency code. `1200` with `TMT` is 12.00 manat.
        Floats are not permitted anywhere near money.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          example: 1200
        currency:
          type: string
          enum: [TMT]
      example:
        amount_minor: 1200
        currency: TMT

    DurationHours:
      type: integer
      enum: [12, 24, 48]
      description: Rental durations offered on the booking screen.

    BankCode:
      type: string
      enum: [halk, senagat, rysgal]
      description: |
        All three are in the enum, but only one acquirer ships first — which one is
        still undecided. Banks without a live integration answer `BANK_NOT_SUPPORTED`,
        and the payment screen greys them out rather than hiding them.

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    HardwareAddress:
      type: object
      description: |
        Which board output drives this lock. Distinct from both the door number and
        the grid position — confusing the three is how a courier ends up opening the
        wrong cell.
      required: [board, output]
      properties:
        board:
          type: integer
          minimum: 0
        output:
          type: integer
          minimum: 0

    # ── errors ────────────────────────────────────────────────────────────

    ErrorCode:
      type: string
      description: |
        Machine-readable, stable forever. Never rendered to a user — the interface
        translates it. Adding a code is not a breaking change; changing one is.
      enum:
        # generic
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_KEY_MISSING
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        # client auth
        - PHONE_INVALID
        - OTP_REQUEST_TOO_SOON
        - OTP_NOT_FOUND
        - OTP_EXPIRED
        - OTP_INVALID
        - OTP_ATTEMPTS_EXCEEDED
        - CLIENT_BLOCKED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_EXPIRED
        - PROFILE_INCOMPLETE
        # admin / staff / device auth
        - ADMIN_CREDENTIALS_INVALID
        - ADMIN_ACCOUNT_BLOCKED
        - STAFF_CREDENTIALS_INVALID

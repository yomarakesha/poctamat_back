        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Free text, min 10 characters — «because» is not a reason.
            example:
              reason: Клиент не может ввести код, подтверждён по телефону оператором
      responses:
        '202':
          description: |
            Command accepted and forwarded to the device. Physical opening is confirmed
            asynchronously — watch the realtime stream or the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [command_id, status]
                properties:
                  command_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, sent]

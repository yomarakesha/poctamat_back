  /admin/bookings/{booking_id}/refund:
    post:
      tags: [Admin — custody]
      operationId: adminRefundBooking
      summary: Refund a booking (operator only)
      description: |
        Clients cannot request refunds — cancelling returns the cell, not the money,
        and that is stated on the summary screen before payment. This endpoint exists
        for the cases that happen anyway: a cabinet that failed, a double charge, a
        complaint an operator decides to settle.

        Not exposed to the mobile app in any form. Reason is mandatory and lands in the
        audit log with the operator's login.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                amount:
                  description: Partial refund. Omit to refund the full amount.
                  oneOf:
                    - $ref: '#/components/schemas/Money'
                    - type: 'null'
      responses:
        '202':
          description: |
            Refund requested at the acquirer. Settlement is asynchronous — watch the
            payment status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Codes: `PAYMENT_NOT_REFUNDABLE`, `REFUND_ALREADY_REQUESTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Codes: `REASON_REQUIRED`, `AMOUNT_MISMATCH`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Codes: `PAYMENT_PROVIDER_UNAVAILABLE`.'
          content:

                                $ref: '#/components/schemas/Money'
              example:
                postamat_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e20
                checked_at: '2026-08-14T09:41:00Z'
                options:
                  - cell_type:
                      id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e30
                      code: small
                      name: Маленький
                      width_mm: 200
                      height_mm: 200
                      depth_mm: 400
                      is_active: true
                    available_count: 4
                    prices:
                      - duration_hours: 12
                        price: { amount_minor: 1200, currency: TMT }
                      - duration_hours: 24
                        price: { amount_minor: 1800, currency: TMT }
                      - duration_hours: 48
                        price: { amount_minor: 2400, currency: TMT }
        '404':
          $ref: '#/components/responses/NotFound'

  /cell-types:
    get:
      tags: [Reference]
      operationId: listCellTypes
      summary: Cell types
      description: Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Cell types.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CellType'
                  pagination:
                    $ref: '#/components/schemas/PagePagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────────────────────────────────────────────────────────── Bookings

  /bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: The client's bookings
      description: |
        Backs the two tabs on screen `488:8413` / `270:5270`.
        `scope=active` returns everything not yet finished; `scope=history` the rest.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [active, history]
            default: active
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bookings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingListItem'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking and hold a cell
      description: |
        A concrete cell is picked and held immediately — the client is about to pay for
        it, so it cannot be handed to somebody else in the meantime. The hold lasts
        `hold_expires_at - now` (10 minutes by default) and the cell sits in `booked`.
        If payment does not complete in time the hold is released and the cell returns
        to `free`.

        `recipient_phone` may be omitted — that is the «Пропустить» path on screen
        `262:3414`, meaning the sender will collect the parcel themselves.

        The sender always pays, always before the parcel goes in. There is no
        pay-on-collection flow.

        There is no fixed cap on concurrent bookings, but the limit is a server
        setting rather than a hard-coded absence: when it is switched on, this endpoint
        answers `BOOKING_LIMIT_EXCEEDED` and the app renders that message. Clients
        must handle the code from day one even while the limit is disabled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postamat_id, cell_type_id, duration_hours]
              properties:
                postamat_id:
                  type: string
                  format: uuid
                cell_type_id:
                  type: string
                  format: uuid
                duration_hours:
                  $ref: '#/components/schemas/DurationHours'
                recipient_phone:
                  oneOf:
                    - $ref: '#/components/schemas/Phone'
                    - type: 'null'
                recipient_name:
                  type: [string, 'null']
                  maxLength: 100
            example:
              postamat_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e20
              cell_type_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e30
              duration_hours: 24
              recipient_phone: '+99362123456'
      responses:
        '201':
          description: |
            Created and held. The response carries the assigned cell number so the
            summary screen (`262:3609`) can show it before payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Codes: `NO_FREE_CELLS`, `CELL_TYPE_UNAVAILABLE`, `POSTAMAT_BLOCKED`.
            `NO_FREE_CELLS` carries nearby alternatives so the app can offer them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NO_FREE_CELLS
                  message: No cells of this size are free.
                  details:
                    alternatives:
                      - postamat_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e21
                        name: ТП #3 Багтыярлык
                        distance_m: 2200
                        available_count: 2
                  trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e40
        '422':
          description: |
            Codes: `DURATION_NOT_SUPPORTED`, `RECIPIENT_PHONE_INVALID`,
            `RECIPIENT_PHONE_SAME_AS_SENDER`, `PROFILE_INCOMPLETE`,
            `BOOKING_LIMIT_EXCEEDED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{booking_id}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: One booking
      description: |
        Everything screen `262:3977` needs, including `deposit_code` while it is still
        valid. The pickup code is never present in this payload.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{booking_id}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Cancel a booking
      description: |
        Allowed while the booking is unpaid, or paid but the parcel has not been
        deposited yet. Once a courier has closed the door the cell is occupied and
        cancellation is no longer a client-side action.

        **Cancelling a paid booking does not refund anything in this version.**
        The cell is released, the money stays. There is no refund endpoint anywhere in
        this API by design — that has to be spelled out on the summary screen before
        the client pays, not discovered afterwards.
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Codes: `BOOKING_NOT_CANCELLABLE`, `BOOKING_ALREADY_CANCELLED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{booking_id}/extend-hold:
    post:
      tags: [Bookings]
      operationId: extendBookingHold
      summary: Extend the 10-minute payment hold
      description: |
        For the case where the hold runs out while the client is on the bank's 3-D
        Secure page. Limited number of extensions; after that the hold dies for good.
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Hold extended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: |
            Codes: `BOOKING_HOLD_EXPIRED`, `HOLD_EXTENSION_LIMIT_EXCEEDED`,
            `BOOKING_ALREADY_PAID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{booking_id}/timeline:
    get:
      tags: [Bookings]
      operationId: getBookingTimeline
      summary: Booking timeline
      description: |
        The checklist on screen `262:3977`: booked → parcel deposited → pickup code
        sent → collected. Steps that have not happened yet are returned with
        `occurred_at: null` so the UI can render them greyed out in the right order.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Timeline.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineStep'
              example:
                items:
                  - step: booked
                    occurred_at: '2026-08-14T06:04:00Z'
                  - step: parcel_deposited
                    occurred_at: '2026-08-14T06:04:00Z'
                  - step: pickup_code_sent
                    occurred_at: null
                  - step: collected
                    occurred_at: null
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────────────────────────────────────────── Payments

  /bookings/{booking_id}/payments:
    post:
      tags: [Payments]
      operationId: initiatePayment
      summary: Start a card payment
      description: |
        Returns a `redirect_url` on the acquirer's own domain. The app opens it in a
        WebView, the card is entered **there**, and the bank sends the user back to
        `return_url` (a deep link). No card number, CVC or expiry ever reaches this API —
        that is what keeps the app and the backend out of PCI DSS scope.

        The deep link is a hint, not a guarantee: the user may kill the WebView, lose
        the network, or come back an hour later. The result screen must poll
        `GET /payments/{payment_id}` regardless.
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, return_url]
              properties:
                bank_code:
                  $ref: '#/components/schemas/BankCode'
                return_url:
                  type: string
                  format: uri
                  description: Deep link the acquirer redirects to, e.g. `postamat://payment/result`.
            example:
              bank_code: halk
              return_url: postamat://payment/result
      responses:
        '201':
          description: Payment session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e50
                booking_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e41
                status: pending
                amount: { amount_minor: 1200, currency: TMT }
                bank_code: halk
                redirect_url: https://epay.halkbank.tm/pay/9f2c1b7a
                expires_at: '2026-08-14T09:51:00Z'
                created_at: '2026-08-14T09:41:00Z'
                failure_code: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Codes: `PAYMENT_ALREADY_EXISTS`, `BOOKING_ALREADY_PAID`,
            `BOOKING_HOLD_EXPIRED`, `BOOKING_ALREADY_CANCELLED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Codes: `BANK_NOT_SUPPORTED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Codes: `PAYMENT_PROVIDER_UNAVAILABLE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{payment_id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Payment status
      description: |
        The authoritative answer for the result screen. Poll this after returning from
        the WebView — and also on a cold start, because the app may have been killed.
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{payment_id}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPayment
      summary: Abandon a pending payment
      description: Called when the user backs out of the WebView deliberately.
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          description: |
            Codes: `PAYMENT_NOT_CANCELLABLE` — the bank already authorised it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      operationId: paymentCallback
      summary: Acquirer callback (server-to-server)
      description: |
        Documented for the backend developer, never called by a front-end. Signature
        verification is mandatory; the exact scheme depends on the acquirer and is an
        open question. This endpoint is the moment the cell flips from held to firmly
        `booked` and the deposit code is issued.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload, passed through as received.
              additionalProperties: true
      responses:
        '200':
          description: Accepted.
        '400':
          description: 'Codes: `CALLBACK_SIGNATURE_INVALID`, `AMOUNT_MISMATCH`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────────────────────── Access codes

  /bookings/{booking_id}/deposit-code/rotate:
    post:
      tags: [Access codes]
      operationId: rotateDepositCode
      summary: Issue a fresh deposit code
      description: |
        Button «Повторно отправить PIN-код курьера». There is no "re-send the same
        code" operation anywhere in this API, because the server stores a keyed hash
        and cannot reproduce the digits. Asking again therefore **mints a new code and
        kills the old one** — which is also the safer behaviour: a code that was
        forwarded to the wrong person stops working the moment the sender asks for
        another.

        The new code comes back in the response (so the app can show and copy it) and
        goes out by SMS to `courier_phone`.

        The pickup code has no equivalent read: it is generated server-side and
        delivered by SMS to the recipient only after the door sensor confirms the
        parcel is inside.
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  oneOf:
                    - $ref: '#/components/schemas/Phone'
                    - type: 'null'
                  description: |
                    Send to a different courier and store that number. Omit to reuse
                    the one captured on screen `262:3414`.
      responses:
        '200':
          description: New code issued; the previous one is revoked.
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at, resend_after]
                properties:
                  code:
                    $ref: '#/components/schemas/Pin'
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
                  resend_after:
                    type: integer
                    description: Seconds before another rotation is allowed.
                    example: 60
              example:
                code: '45865'
                expires_at: '2026-08-15T09:41:00Z'
                resend_after: 60
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Codes: `GRANT_ALREADY_USED` — the parcel is already inside, so there is
            nothing left to open with; `GRANT_EXPIRED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Codes: `CODE_RESEND_TOO_SOON`, `CODE_RESEND_LIMIT_EXCEEDED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{booking_id}/pickup-code/rotate:
    post:
      tags: [Access codes]
      operationId: rotatePickupCode
      summary: Issue a fresh pickup code, SMS it, and return it once
      description: |
        Button «Повторно отправить одноразовый PIN-код». Same rule as the deposit code:
        the old one dies, a new one is minted, and the digits come back **once** — in
        this response and nowhere else.

        The sender reads them. That is the C2C flow the mockups draw: the recipient
        never registers anywhere, and when the SMS does not arrive the sender is the
        one who reads the code out over the phone. Returning nothing here would break
        precisely the case this endpoint exists for.

        What the two grants protect is unchanged: the **courier** holds the deposit
        code and only that, so the person carrying the box still cannot collect it. A
        sender who opens their own parcel is not theft — they paid for it.

        Every later read returns null. Never in a notification, never in the admin
        panel, never in a log line.
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: |
            New code issued, the previous one revoked, SMS on its way. The digits are
            here and in no other response.
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at, resend_after]
                properties:
                  code:
                    $ref: '#/components/schemas/Pin'
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
                  resend_after:
                    type: integer
        '409':
          description: |
            Codes: `PICKUP_CODE_NOT_ISSUED_YET` (the parcel is not in the cell yet),
            `GRANT_ALREADY_USED`, `GRANT_EXPIRED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Codes: `CODE_RESEND_TOO_SOON`, `CODE_RESEND_LIMIT_EXCEEDED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{booking_id}/pickup-code/transfer:
    post:
      tags: [Access codes]
      operationId: transferPickup
      summary: Transfer the right to collect to another phone
      description: |
        Revokes the current pickup grant and issues a fresh one to a different number.
        People forward codes over messengers anyway — this makes it an explicit,
        audited action instead of an invisible one.
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_phone]
              properties:
                new_phone:
                  $ref: '#/components/schemas/Phone'
                new_name:
                  type: [string, 'null']
                  maxLength: 100
      responses:
        '200':
          description: |
            Transferred. The old code stops working immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: |
            Codes: `TRANSFER_NOT_ALLOWED` (parcel already collected),
            `PICKUP_CODE_NOT_ISSUED_YET`, `GRANT_ALREADY_USED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Codes: `TRANSFER_PHONE_SAME`, `RECIPIENT_PHONE_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────────────────────────────────────────────────────────────────── Kiosk

  /kiosk/context:
    get:
      tags: [Kiosk]
      operationId: getKioskContext
      summary: What this terminal needs to render its idle screen
      description: |
        Postamat identity, supported languages, support phone numbers for the
        «ЯЧЕЙКА ЗАБЛОКИРОВАНО» screen, and whether the core considers this device
        healthy. Polled on a slow interval; the connectivity banner is driven by
        request failures, not by this field alone.
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Context.
          content:
            application/json:
              schema:
                type: object
                required: [postamat, languages, support_phones, server_time]
                properties:
                  postamat:
                    $ref: '#/components/schemas/Postamat'
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
                  support_phones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Phone'
                  server_time:
                    $ref: '#/components/schemas/Timestamp'
                  pin_length:
                    type: integer
                    description: Always 5. The terminal renders this many boxes.
                    example: 5
                  max_pin_attempts:
                    type: integer
                    description: Always 3. «Попытка N из 3» reads this.
                    example: 3
                  offline_ttl_seconds:
                    type: integer
                    default: 86400
                    description: |
                      How long the agent may keep serving pickups after its last
                      successful sync. 24 hours by default, per postamat.

                      Long on purpose. The two costs are not symmetric: a false refusal
                      hits many people during an ordinary connectivity drop, which in a
                      post office is routine, while a stale acceptance is rare and lets
                      in somebody the sender had already designated — not a stranger.
                      Three things narrow the window without shortening it: the agent
                      rejects expired bookings from its own cache, it reports every
                      offline acceptance on reconnect so mismatches raise an alert, and
                      a transfer against an offline postamat tells the person plainly
                      that the old code may keep working until the TTL runs out.
                  door_close_timeout_seconds:
                    type: integer
                    default: 60
                    description: |
                      How long «Ожидание закрытия датчика...» waits before the terminal
                      reports `closed: false`, shows a reminder and raises a ticket.
                  idle_timeout_seconds:
                    type: integer
                    default: 60
                    description: |
                      Inactivity before the session resets: back to the splash screen,
                      PIN cleared, language back to `default_language`.
                  default_language:
                    $ref: '#/components/schemas/Language'
              example:
                postamat:
                  id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e20
                  name: ТП #4 Беркарарлык
                  address: Почтовый офис 744000, проспект Атамурата Ниязова 72
                  status: active
                languages: [tk, ru, en]
                support_phones: ['+99365555550', '+99365125512']
                server_time: '2026-08-14T09:41:00Z'
                pin_length: 5
                max_pin_attempts: 3
                door_close_timeout_seconds: 60
                idle_timeout_seconds: 60
                default_language: tk
        '401':
          $ref: '#/components/responses/Unauthorized'

  /kiosk/sessions:
    post:
      tags: [Kiosk]
      operationId: verifyKioskPin
      summary: Verify a PIN and open a terminal session
      description: |
        There is no cell wall on this terminal: the code decides which door opens, so
        nobody can point at a stranger's cell and start guessing against it.

        `role` comes from the «Владелец / Курьер» screen and is a cross-check, not a
        selector — a deposit code presented as `owner` is refused.

        The attempt counter is scoped to the **terminal**, not to a cell. A wrong PIN
        matches no cell at all — until a code verifies, nobody knows which door the
        person was heading for — so failed attempts can never produce
        `CellStatus.blocked`. After three failures the terminal locks for a cooling
        period and says so; the cells are untouched.

        **A second limit, per postamat, is mandatory — not optional.** Three attempts
        per session is trivially bypassed by starting a new session. A 5-digit PIN is
        100 000 combinations; with ~20 live codes in one cabinet a random guess lands
        about 1 in 5 000, so an evening of typing brute-forces a door. The device-wide
        limiter is what makes a 5-digit code survivable, and it answers `RATE_LIMITED`
        with `Retry-After`.

        Related storage rule: a 5-digit PIN has too small a search space for a plain
        hash to protect it — 100 000 candidates is nothing. The stored value must be a
        keyed HMAC or a slow KDF with a pepper held outside the database.

        **Active codes are unique within a postamat.** Five digits is a space of
        100 000; a full 43-cell cabinet holds up to ~86 live codes, and the chance
        that two of them collide is about 4% per full cabinet — not a tail case.
        On a collision this endpoint has two candidate cells and no way to choose,
        and whichever it picks, somebody opens a stranger's parcel. Generation
        retries until the code is unique among that postamat's active codes.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, role]
              properties:
                pin:
                  $ref: '#/components/schemas/Pin'
                role:
                  type: string
                  enum: [owner, courier]
                  description: |
                    `courier` — leaving a parcel (deposit grant).
                    `owner` — collecting one (pickup grant).
            example:
              pin: '88422'
              role: owner
      responses:
        '201':
          description: |
            PIN accepted. The session is short-lived; the terminal must call `open`
            straight away.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskSession'
              example:
                id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e60
                cell:
                  id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e70
                  postamat_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e20
                  cell_type_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e30
                  number: '14'
                  row: 3
                  col: 2
                  hardware_address: { board: 1, output: 14 }
                grant_kind: pickup
                booking_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e41
                expires_at: '2026-08-14T09:43:00Z'
                status: verified
        '401':
          description: |
            Codes: `PIN_INVALID`. `details.attempts_left` drives «Попытка N из 3».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: PIN_INVALID
                  message: Wrong code.
                  details:
                    attempts_left: 1
                    attempt: 2
                    max_attempts: 3
                  trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e61
        '403':
          description: |
            Codes: `PIN_ATTEMPTS_EXCEEDED` — the third failure. The **terminal** is
            locked for `details.locked_for_seconds`; no cell changed state. The screen
            has to say that, with the support numbers from `/kiosk/context` — telling
            somebody their cell is blocked when it is not sends them to a counter to
            resolve a problem that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: PIN_ATTEMPTS_EXCEEDED
                  message: Cell blocked after three failed attempts.
                  details:
                    cell_number: '14'
                  trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e62
        '409':
          description: |
            Codes: `GRANT_ALREADY_USED`, `GRANT_EXPIRED`, `GRANT_REVOKED`,
            `CELL_BLOCKED`, `CELL_IN_MAINTENANCE`, `GRANT_ROLE_MISMATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Codes: `RATE_LIMITED` — the per-postamat limiter tripped. The terminal shows
            a neutral «попробуйте позже» and does **not** reveal how close a guess was.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Codes: `CORE_UNREACHABLE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/sessions/{session_id}/open:
    post:
      tags: [Kiosk]
      operationId: openKioskCell
      summary: Ask the core to authorise opening the cell
      description: |
        The core authorises; the physical unlatch is issued by the local lock agent
        over the loopback WebSocket (see `docs/API-01.md`, section «Kiosk ↔ lock
        agent»). This call burns the grant — it cannot be replayed.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/KioskSessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Authorised. The terminal now shows «ЯЧЕЙКА ОТКРЫТА».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskSession'
        '404':
          description: 'Codes: `KIOSK_SESSION_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Codes: `KIOSK_SESSION_EXPIRED`, `GRANT_ALREADY_USED`, `CELL_BLOCKED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/sessions/{session_id}/door-closed:
    post:
      tags: [Kiosk]
      operationId: reportDoorClosed
      summary: Report the door sensor state (display path only)
      description: |
        The hinge of the whole system. On a **deposit** the door closing is what flips
        the cell to `occupied` and releases the pickup code by SMS — not the click of a
        button, not a timer. On a **pickup** it closes the booking and returns the cell
        to `free`.

        **The agent is the reporter of record, not this endpoint.** Door events arrive
        at the agent over the local socket and the agent reports them to the core
        directly. Routing the one event that releases a parcel's code through a browser
        tab means a reload, a renderer crash or a frozen kiosk at the wrong second
        leaves the parcel inside and the recipient with no code, and no event anywhere
        saying so.

        The terminal still calls this so the core knows what the person was shown; the
        core treats it as corroboration and ignores it when the agent has already
        spoken.

        `closed: false` means the door never reported shut. After a deposit the booking
        stays in `awaiting_deposit`, **no pickup code is released**, an alert is raised
        and a human resolves it. Silence here would leave a parcel inside a cabinet the
        system believes is empty. `sensor_fault` is handled the same way and puts the
        cell into `maintenance`.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/KioskSessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closed, observed_at]
              properties:
                closed:
                  type: boolean
                observed_at:
                  $ref: '#/components/schemas/Timestamp'
                sensor_fault:
                  type: boolean
                  default: false
                  description: The agent could not read the sensor at all.
            example:
              closed: true
              observed_at: '2026-08-14T09:42:30Z'
              sensor_fault: false
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskSession'
        '409':
          description: 'Codes: `KIOSK_SESSION_EXPIRED`, `DOOR_SENSOR_FAULT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/sessions/{session_id}/cancel:
    post:
      tags: [Kiosk]
      operationId: cancelKioskSession
      summary: Abandon the session
      description: The «Отмена» button, and the inactivity timeout.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/KioskSessionId'
      responses:
        '204':
          description: Cancelled.
        '404':
          $ref: '#/components/responses/NotFound'

  /kiosk/qr-sessions:
    post:
      tags: [Kiosk]
      operationId: createQrSession
      summary: Start QR sign-in
      description: |
        The alternative to typing a PIN: the terminal renders `qr_payload`, the phone
        scans it and confirms over the network. The terminal polls until the state
        turns `confirmed`, then continues exactly as after a verified PIN.
      security:
        - deviceAuth: []
      responses:
        '201':
          description: QR session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrSession'
        '503':
          description: 'Codes: `CORE_UNREACHABLE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /kiosk/qr-sessions/{qr_session_id}:
    get:
      tags: [Kiosk]
      operationId: getQrSession
      summary: Poll QR sign-in state
      security:
        - deviceAuth: []
      parameters:
        - name: qr_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: QR session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 'Codes: `QR_SESSION_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /qr-sessions/{qr_session_id}/confirm:
    post:
      tags: [Kiosk]
      operationId: confirmQrSession
      summary: Confirm QR sign-in from the phone
      description: Called by the mobile app, authenticated as the client.
      parameters:
        - name: qr_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id]
              properties:
                booking_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Confirmed — the terminal will pick this up on its next poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Codes: `QR_SESSION_ALREADY_CONFIRMED`, `QR_SESSION_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────────────────── Kiosk (staff)

  /kiosk/staff/cells:
    get:
      tags: [Kiosk (staff)]
      operationId: listKioskStaffCells
      summary: All cells of this postamat, for staff mode only
      description: |
        The cell wall exists here and nowhere else. A member of staff needs to see the
        whole cabinet to unload expired parcels and to diagnose locks; the public does not.
      security:
        - staffAuth: []
      responses:
        '200':
          description: Cells with live state.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CellWithState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /kiosk/staff/cells/{cell_id}/force-open:
    post:
      tags: [Kiosk (staff)]
      operationId: staffForceOpenCell
      summary: Open a cell without a grant
      description: |
        Deliberately not an ordinary action: a reason is mandatory, the event is
        written to the audit log with the staff member's identity, and the client is
        notified if the cell was holding their parcel.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/CellId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true

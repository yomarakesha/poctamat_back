openapi: 3.1.0

info:
  title: Postamat Platform API
  version: 1.0.0-draft.1
  summary: Parcel locker platform for Türkmenpoçta — client app, kiosk terminal, admin panel.
  description: |
    Single source of truth for the HTTP contract between three front-ends
    (Flutter client app, kiosk terminal, admin panel) and the core backend.

    Conventions — see `docs/API-01.md` for prose:

    * All JSON fields are `snake_case`.
    * All identifiers are UUID (v7 preferred).
    * All timestamps are UTC, ISO-8601 with `Z`. Clients render in `Asia/Ashgabat`.
    * All money is an integer in minor units plus a currency code. Never a float.
    * All phone numbers are E.164 (`+993…`).
    * Breaking changes ship as `/api/v2`, never as edits to `/api/v1`.

    Generated clients: `orval`/`openapi-typescript` for web, `openapi-generator` for Dart.
    Do not hand-edit generated code — edit this file.
  contact:
    name: Postamat platform team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.postamat.tm/api/v1
    description: Production (inside Türkmenistan)
  - url: https://stage.postamat.tm/api/v1
    description: Staging
  - url: http://localhost:4010/api/v1
    description: Prism mock from this file

tags:
  - name: Auth (client)
    description: Phone + OTP authentication for the mobile app.
  - name: Auth (admin)
    description: Login/password authentication for the admin panel.
  - name: Auth (kiosk)
    description: Device provisioning and staff sign-in on the terminal.
  - name: Profile
    description: The signed-in client's own profile and notification settings.
  - name: Reference
    description: Cities, postamats, cell types, availability. Read-only for clients.
  - name: Bookings
    description: Booking a cell, holding it, cancelling, timeline.
  - name: Payments
    description: Card payment via the acquirer's hosted page. No card data ever touches this API.
  - name: Access codes
    description: Deposit and pickup grants, resend, transfer of pickup rights.
  - name: Kiosk
    description: Terminal session — PIN entry, opening, door sensor, QR sign-in.
  - name: Kiosk (staff)
    description: Staff mode on the terminal — force open, unload expired, lock diagnostics.
  - name: Admin — postamats
    description: Postamat CRUD, blocking, photos and map placement.
  - name: Admin — cell types
    description: Sizes and tariffs. Blocked, never deleted.
  - name: Admin — cells
    description: Cell CRUD, bulk cabinet creation, blocking, maintenance, the monitor.
  - name: Admin — custody
    description: Removal acts, parcels held at the counter, operator refunds.
  - name: Admin — clients
    description: Client directory and blocking.
  - name: Admin — devices
    description: Device fleet, provisioning codes, remote opening.
  - name: Admin — users and roles
    description: Admin accounts and the permission mechanism.
  - name: Admin — audit log
    description: Append-only journal and its streaming CSV export.
  - name: Admin — statistics
    description: Dashboard tiles, charts and revenue.
  - name: Realtime
    description: Server-sent updates for the admin monitor.
  - name: Webhooks
    description: Server-to-server callbacks. Documented here, never called by a front-end.

security:
  - clientAuth: []

paths:

  # ───────────────────────────────────────────────────────────── Auth (client)

  /auth/otp/request:
    post:
      tags: [Auth (client)]
      operationId: requestOtp
      summary: Request a one-time SMS code
      description: |
        Rate-limited per phone and per device. The response never reveals whether the
        phone is already registered — the app decides what to show after `verify`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
            example:
              phone: '+99365123456'
      responses:
        '200':
          description: Code sent (or re-sent within the allowed window).
          content:
            application/json:
              schema:
                type: object
                required: [request_id, code_length, expires_at, resend_after]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  code_length:
                    type: integer
                    description: |
                      OTP length. Always 6 — and deliberately different from the
                      5-digit cell PIN, which is a separate secret.
                    example: 6
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
                  resend_after:
                    type: integer
                    description: Seconds until `request` may be called again for this phone.
                    example: 60
              example:
                request_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e01
                code_length: 6
                expires_at: '2026-08-14T09:46:00Z'
                resend_after: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: |
            The client is blocked. Codes: `CLIENT_BLOCKED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Codes: `OTP_REQUEST_TOO_SOON`, `RATE_LIMITED`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: OTP_REQUEST_TOO_SOON
                  message: Wait before requesting a new code.
                  details:
                    resend_after: 47
                  trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e02
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/otp/verify:
    post:
      tags: [Auth (client)]
      operationId: verifyOtp
      summary: Exchange an OTP for a token pair
      description: |
        The attempt counter lives on the server, on the OTP request. The app only
        renders `attempts_left` from the error body — it must never count locally.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, code]
              properties:
                request_id:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
            example:
              request_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e01
              code: '434444'
      responses:
        '200':
          description: |
            Authenticated. `profile_complete` is `false` for a brand-new client —
            the app then shows the profile form before anything else.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    required: [profile_complete]
                    properties:
                      profile_complete:
                        type: boolean
              example:
                access_token: eyJhbGciOiJI...
                refresh_token: v4.public.eyJ...
                token_type: Bearer
                expires_in: 900
                profile_complete: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Codes: `OTP_INVALID` (with `attempts_left`), `OTP_EXPIRED`, `OTP_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: OTP_INVALID
                  message: Wrong code.
                  details:
                    attempts_left: 2
                  trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e03
        '403':
          description: 'Codes: `CLIENT_BLOCKED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Codes: `OTP_ATTEMPTS_EXCEEDED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth (client)]
      operationId: refreshToken
      summary: Rotate the token pair
      description: Refresh tokens are single-use. Reuse revokes the whole family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 'Codes: `REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth (client)]
      operationId: logout
      summary: Revoke the current session
      description: Also removes the push token bound to this session, if any.
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/push-tokens:
    post:
      tags: [Auth (client)]
      operationId: registerPushToken
      summary: Register a device push token
      description: |
        Push is an accelerator on top of SMS, never a replacement. The pickup PIN is
        never delivered through this channel.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  maxLength: 512
                platform:
                  type: string
                  enum: [android, ios]
                app_version:
                  type: string
                  example: 1.0.0+42
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [push_token_id]
                properties:
                  push_token_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/push-tokens/{push_token_id}:
    delete:
      tags: [Auth (client)]
      operationId: deletePushToken
      summary: Remove a device push token
      parameters:
        - name: push_token_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────────────────────────────────────── Auth (admin)

  /admin/auth/login:
    post:
      tags: [Auth (admin)]
      operationId: adminLogin
      summary: Sign in to the admin panel
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  maxLength: 128
                password:
                  type: string
                  format: password
                  maxLength: 256
            example:
              login: admin@1337
              password: correct-horse-battery-staple
      responses:
        '200':
          description: |
            Authenticated. `permissions` drives which actions the UI renders —
            but the server checks them again on every call.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'Codes: `ADMIN_CREDENTIALS_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Codes: `ADMIN_ACCOUNT_BLOCKED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Codes: `RATE_LIMITED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/auth/refresh:
    post:
      tags: [Auth (admin)]
      operationId: adminRefreshToken
      summary: Rotate the admin token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 'Codes: `REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/auth/logout:
    post:
      tags: [Auth (admin)]
      operationId: adminLogout
      summary: Revoke the current admin session
      security:
        - adminAuth: []
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/auth/me:
    get:
      tags: [Auth (admin)]
      operationId: getAdminMe
      summary: Current admin user, role and permissions
      security:
        - adminAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────────────────────── Auth (kiosk)

        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /kiosk/auth/provision:
    post:
      tags: [Auth (kiosk)]
      operationId: provisionDevice
      summary: Bind a terminal to a postamat and obtain a device token
      description: |
        Run once, at installation. The provisioning code is issued in the admin panel
        and is valid for a single use. Afterwards the terminal authenticates with the
        device token and never shows a login screen to the public.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provisioning_code, hardware_id]
              properties:
                provisioning_code:
                  type: string
                  minLength: 8
                  maxLength: 64
                hardware_id:
                  type: string
                  description: Stable machine identifier (serial or MAC).
                  example: 00:1A:2B:3C:4D:5E
                os_version:
                  type: string
                app_version:
                  type: string
      responses:
        '200':
          description: Device bound.
          content:
            application/json:
              schema:
                type: object
                required: [device_token, device, postamat]
                properties:
                  device_token:
                    type: string
                    description: Long-lived. Stored in the device keystore, never in web storage.
                  device:
                    $ref: '#/components/schemas/Device'
                  postamat:
                    $ref: '#/components/schemas/Postamat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'Codes: `DEVICE_PROVISION_CODE_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Codes: `DEVICE_ALREADY_PROVISIONED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/auth/staff/login:
    post:
      tags: [Auth (kiosk)]
      operationId: kioskStaffLogin
      summary: Staff sign-in on the terminal
      description: |
        Opens staff mode on top of the device session. Short-lived on purpose —
        staff sessions expire with terminal inactivity.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Staff session opened.
          content:
            application/json:
              schema:
                type: object
                required: [staff_token, expires_in, user]
                properties:
                  staff_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
                  user:
                    $ref: '#/components/schemas/AdminUser'
        '401':
          description: 'Codes: `STAFF_CREDENTIALS_INVALID`, `DEVICE_NOT_PROVISIONED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Codes: `FORBIDDEN`, `DEVICE_BLOCKED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/auth/staff/logout:
    post:
      tags: [Auth (kiosk)]
      operationId: kioskStaffLogout
      summary: Close the staff session
      security:
        - staffAuth: []
      responses:
        '204':
          description: Closed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────────────────────────── Profile

  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Current client profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update name, city or language
      description: |
        Used both for first-time profile completion (screen «Регистрация») and for
        later edits (screen «Профиль (изменения)»). Fields are optional individually,
        but `last_name` and `first_name` must both be present before the client can book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                middle_name:
                  type: [string, 'null']
                  maxLength: 100
                  description: Optional by design — the field is labelled «необязательно».
                city_id:
                  type: string
                  format: uuid
                language:
                  $ref: '#/components/schemas/Language'
            example:
              last_name: Аннаев
              first_name: Мырат
              middle_name: Аннаевич
              city_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e10
              language: ru
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Codes: `CITY_NOT_AVAILABLE` (a city marked «скоро»), `NAME_INVALID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/notification-settings:
    get:
      tags: [Profile]
      operationId: getNotificationSettings
      summary: Notification preferences
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateNotificationSettings
      summary: Update notification preferences
      description: |
        Only push channels are switchable. Transactional SMS — above all the pickup
        code — cannot be disabled, which is why the SMS flags are read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_parcel_deposited:
                  type: boolean
                push_cell_opened:
                  type: boolean
                push_expiring_soon:
                  type: boolean
                push_marketing:
                  type: boolean
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/notifications:
    get:
      tags: [Profile]
      operationId: listNotifications
      summary: Notification feed
      description: |
        What the «Уведомление» screen shows. Push delivery is not guaranteed and a
        dismissed banner is gone forever, so every notification is also recorded here —
        this list is the durable copy.

        Never contains a pickup code, in any field.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Notifications, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, unread_count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unread_count:
                    type: integer
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/notifications/read:
    post:
      tags: [Profile]
      operationId: markNotificationsRead
      summary: Mark notifications as read
      description: Omit `notification_ids` to mark everything read.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────────────────────── Reference

  /cities:
    get:
      tags: [Reference]
      operationId: listCities
      summary: Cities
      description: |
        Returns every city, including the ones that are not live yet. The app shows
        them greyed out with «скоро» rather than hiding them — see screen `190:1657`.

        Public: a person should be able to see what the service offers before handing
        over their phone number.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Cities.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  pagination:
                    $ref: '#/components/schemas/PagePagination'
              example:
                items:
                  - id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e10
                    name: Aşgabat
                    is_available: true
                    postamat_count: 6
                  - id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e11
                    name: Arkadag
                    is_available: true
                    postamat_count: 1
                  - id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e12
                    name: Mary
                    is_available: false
                    postamat_count: 0
                pagination:
                  page: 1
                  per_page: 50
                  total: 7
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /postamats:
    get:
      tags: [Reference]
      operationId: listPostamats
      summary: Postamats for the map and the list
      description: |
        Backs screen `193:1905`: a map with pins plus a list ordered by distance.
        Pass `near_lat`/`near_lon` to get `distance_m` filled in; without them the
        list is ordered by name and `distance_m` is `null` (the app then hides it).
        Blocked postamats are omitted entirely for clients.

        Public — the map, the prices and the free-cell counts are all visible before
        sign-in. Login is required only to actually book.
      security: []
      parameters:
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: near_lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: near_lon
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: has_free_cells
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Postamats.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostamatListItem'
                  pagination:
                    $ref: '#/components/schemas/PagePagination'
              example:
                items:
                  - id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e20
                    name: ТП #4 Беркарарлык
                    address: Почтовый офис 744000, проспект Атамурата Ниязова 72
                    city_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e10
                    location:
                      lat: 37.9601
                      lon: 58.3261
                    working_hours: '08:00–20:00'
                    status: active
                    distance_m: 1200
                    free_cell_count: 6
                pagination:
                  page: 1
                  per_page: 20
                  total: 6
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'

  /postamats/{postamat_id}:
    get:
      tags: [Reference]
      operationId: getPostamat
      summary: Postamat details with live availability
      description: |
        Backs screen `197:2947` — sizes, dimensions, prices and remaining counts. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/PostamatId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Postamat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostamatDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Codes: `POSTAMAT_BLOCKED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /postamats/{postamat_id}/availability:
    get:
      tags: [Reference]
      operationId: getPostamatAvailability
      summary: Availability and price per cell type and duration
      description: |
        Prices depend on both the cell type and the rental duration, so this endpoint
        returns the full matrix the size picker needs. `available_count: 0` renders as
        «недоступно» and the option is not selectable.

        Prices come from the city × cell type tariff matrix. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/PostamatId'
      responses:
        '200':
          description: Availability matrix.
          content:
            application/json:
              schema:
                type: object
                required: [postamat_id, options, checked_at]
                properties:
                  postamat_id:
                    type: string
                    format: uuid
                  checked_at:
                    $ref: '#/components/schemas/Timestamp'
                  options:
                    type: array

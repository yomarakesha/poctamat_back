  /admin/cells/{cell_id}/unblock:
    post:
      tags: [Admin — cells]
      operationId: adminUnblockCell
      summary: Unblock a cell
      description: |
        A blocked cell may still have a parcel in it, so the panel must ask what
        happened to it before the cell can go back into circulation. `parcel_fate` is
        mandatory and lands in the audit log.
      security:

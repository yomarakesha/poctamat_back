      summary: Opening hours
      description: |
        Hours are structured rather than a display string, because expiry depends on
        them. Paying for 12 hours at 19:00 at a site that closes at 20:00 would expire
        at 07:00 — before the recipient could physically arrive. When a postamat is not
        `round_the_clock`, expiry is pushed to shortly after the next opening, and the
        grace period runs from there too.
      security:
        - adminAuth: []
      parameters:

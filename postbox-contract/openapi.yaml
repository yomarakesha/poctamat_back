  /admin/cells/bulk:
    post:
      tags: [Admin — cells]
      operationId: adminBulkCreateCells
      summary: Create a whole cabinet in one form
      description: |
        Nobody is filling in 42 forms by hand. Either every cell is created or none is —
        a partial cabinet is worse than no cabinet.

        `numbering_start` sets the number on the first door; positions are filled
        row by row across `grid_rows` × `grid_cols`; hardware addresses are taken from
        `hardware_start` and incremented, which is exactly how the boards are wired.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postamat_id, grid_rows, grid_cols, layout]
              properties:
                postamat_id:
                  type: string
                  format: uuid
                grid_rows:
                  type: integer
                  minimum: 1
                  maximum: 20
                grid_cols:
                  type: integer
                  minimum: 1
                  maximum: 20
                numbering_start:
                  type: integer
                  default: 1
                hardware_start:
                  type: object
                  properties:
                    board:
                      type: integer
                      minimum: 0
                    output:
                      type: integer
                      minimum: 0
                layout:
                  type: array
                  description: |
                    One entry per cell type, in the order the rows should be filled.
                  items:
                    type: object
                    required: [cell_type_id, count]
                    properties:
                      cell_type_id:
                        type: string
                        format: uuid
                      count:
                        type: integer
                        minimum: 1
            example:
              postamat_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e20
              grid_rows: 7
              grid_cols: 6
              numbering_start: 1
              hardware_start: { board: 1, output: 1 }
              layout:
                - { cell_type_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e30, count: 24 }
                - { cell_type_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e31, count: 12 }
                - { cell_type_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e32, count: 6 }
      responses:
        '201':
          description: All cells created.
          content:
            application/json:
              schema:
                type: object
                required: [created_count, items]
                properties:
                  created_count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cell'
        '409':
          description: |
            Codes: `BULK_CREATE_PARTIAL_FAILURE` — nothing was written; `details.conflicts`
            lists the offending positions, numbers or hardware addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Codes: `LAYOUT_EXCEEDS_GRID` — the counts do not fit `grid_rows × grid_cols`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'

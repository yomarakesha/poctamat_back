    ErrorResponse:
      type: object
      description: The single error envelope. Every non-2xx response uses this shape.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: English, for developers and logs. Not shown to end users.
            details:
              type: [object, 'null']
              additionalProperties: true
              description: Structured extras — `attempts_left`, `fields`, `alternatives`.
            trace_id:
              type: string
              description: Correlates with server logs and the audit trail.
      example:
        error:
          code: CELL_ALREADY_TAKEN
          message: This cell was taken by another booking.
          details:
            cell_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4e70
          trace_id: 0190f2c1-6b7a-7c3e-9a11-2f0c9a5d4eaa

    # ── pagination ────────────────────────────────────────────────────────

    PagePagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    CursorPagination:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
        truncated_at:
          type: [string, 'null']
          format: date-time
          description: |
            Audit log only. Set when the requested range reaches past the one-year hot
            window — everything older lives in cold storage and comes out via CSV export.

    # ── auth ──────────────────────────────────────────────────────────────

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          description: Always `Bearer`.
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    Permission:
      type: string
      description: |
        Granular capability. The client hides actions it lacks; the server enforces
        them regardless. Not an exhaustive enum on purpose — roles are a mechanism.
      examples:
        - postamats.read
        - postamats.write
        - cells.block
        - cells.remote_open
        - clients.block
        - audit.export
        - users.manage

    Role:
      type: object
      required: [id, code, name, permissions]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: superadmin
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    AdminUser:
      type: object
      required: [id, login, full_name, role, permissions, is_active]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        postamat_ids:
          type: array
          description: Empty means unrestricted.
          items:
            type: string
            format: uuid
        is_active:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time

    # ── client ────────────────────────────────────────────────────────────

    Client:
      type: object
      required: [id, phone, status, language]
      properties:
        id:
          type: string
          format: uuid
        phone:
          $ref: '#/components/schemas/Phone'
        last_name:
          type: [string, 'null']
        first_name:
          type: [string, 'null']
        middle_name:
          type: [string, 'null']
        city_id:
          type: [string, 'null']
          format: uuid
        language:
          $ref: '#/components/schemas/Language'
        status:
          type: string
          enum: [active, blocked]
        profile_complete:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'

    NotificationSettings:
      type: object
      required: [push_parcel_deposited, push_cell_opened, push_expiring_soon, sms_always_on]
      properties:
        push_parcel_deposited:
          type: boolean
        push_cell_opened:
          type: boolean
        push_expiring_soon:
          type: boolean
        push_marketing:
          type: boolean
        sms_always_on:
          type: boolean
          readOnly: true
          description: |
            Transactional SMS cannot be switched off. The pickup code is delivered by
            SMS and nothing else — it is the only channel we can answer for.

    Notification:
      type: object
      required: [id, type, title, body, created_at, read_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: |
            Open-ended. Known values: `parcel_deposited`, `pickup_code_sent`,
            `cell_opened`, `expiring_soon`, `expired`, `booking_cancelled`,
            `payment_failed`, `pickup_transferred`.

                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        '200':
          description: Authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellWithState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'Codes: `REASON_REQUIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/staff/expired:
    get:
      tags: [Kiosk (staff)]
      operationId: listExpiredParcels
      summary: Parcels past their storage deadline
      description: |
        Backs the sentence printed on three different mobile screens: after the
        storage period the parcel is moved to the counter and staff free the cell by hand.
      security:
        - staffAuth: []
      responses:
        '200':
          description: Expired parcels.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpiredParcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /kiosk/staff/expired/{booking_id}/unload:
    post:
      tags: [Kiosk (staff)]
      operationId: unloadExpiredParcel
      summary: Record that an expired parcel was removed
      description: Frees the cell and closes the booking as `expired_unloaded`.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  type: string
                  enum: [counter, storage, returned_to_sender]
                note:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: 'Codes: `BOOKING_NOT_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/staff/break-glass:
    post:
      tags: [Kiosk (staff)]
      operationId: staffBreakGlass
      summary: Open one named cell while the core is unreachable
      description: |
        The way out of a cabinet that has outlived its offline window.

        Offline the terminal will not open anything once the agent's cache is older
        than `offline_ttl`. Without this that rule traps parcels: a postamat with a cut
        uplink and boxes inside has no remaining tool but a screwdriver, and a
        multi-day outage at a post office is ordinary.

        The flow needs no network at all. The kiosk shows a `challenge`; staff read it
        to the operations centre by phone; the centre computes the `response` with a
        key held outside the database; staff type it back. Exactly one named cell
        opens. The event is recorded locally and flushed to the audit log on reconnect,
        so it is bounded and attributable rather than a master key.

        Documented here because the clients render it. The verification itself lives in
        the agent — an endpoint that needs the core would defeat the purpose.
      security:
        - staffAuth: []
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cell_number, challenge, response, reason]
              properties:
                cell_number:
                  type: string
                challenge:
                  type: string
                  description: What the terminal displayed.
                response:
                  type: string
                  description: What the operations centre computed from it.
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        '200':
          description: The cell opened.
          content:
            application/json:
              schema:
                type: object
                required: [cell_number, opened_at]
                properties:
                  cell_number:
                    type: string
                  opened_at:
                    $ref: '#/components/schemas/Timestamp'
        '401':
          description: 'Codes: `BREAK_GLASS_RESPONSE_INVALID`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Codes: `REASON_REQUIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/staff/diagnostics:
    get:
      tags: [Kiosk (staff)]
      operationId: getLockDiagnostics
      summary: Lock and sensor diagnostics
      description: |
        Proxies the local lock agent's health view through the core so the result is
        also recorded centrally.
      security:
        - staffAuth: []
      responses:
        '200':
          description: Diagnostics.
          content:
            application/json:
              schema:
                type: object
                required: [checked_at, locks]
                properties:
                  checked_at:
                    $ref: '#/components/schemas/Timestamp'
                  agent_connected:
                    type: boolean
                  locks:
                    type: array
                    items:
                      type: object
                      required: [cell_id, cell_number, lock_ok, sensor_ok]
                      properties:
                        cell_id:
                          type: string
                          format: uuid
                        cell_number:
                          type: string
                        lock_ok:
                          type: boolean
                        sensor_ok:
                          type: boolean
                        door_open:
                          type: boolean
                        last_error:
                          type: [string, 'null']
        '503':
          description: 'Codes: `LOCK_AGENT_UNAVAILABLE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


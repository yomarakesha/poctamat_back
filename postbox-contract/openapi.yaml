      summary: Open a cell remotely
      description: |
        The most dangerous button in the panel, and it is meant to look like it.
        A reason is mandatory, a second confirmation happens in the UI, the event is
        written to the audit log with the operator's identity, and the client is
        notified that their cell was opened.
      security:

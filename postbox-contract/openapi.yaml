              $ref: '#/components/schemas/Language'
            blocked_reason:
              type: [string, 'null']
            blocked_at:
              type: [string, 'null']
              format: date-time
            total_bookings:
              type: integer

    # ── geography and hardware ────────────────────────────────────────────

    City:
      type: object
      required: [id, name, is_available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_available:
          type: boolean
          description: |
            `false` renders as «скоро» and is not selectable. Unavailable cities are
            shown, not hidden — people need to see their city is coming.
        postamat_count:
          type: integer

    PostamatStatus:
      type: string
      enum: [active, maintenance, blocked]

    Postamat:
      type: object
      required: [id, name, address, status]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: |
            Human-facing identifier shown in the admin table. Alphanumeric — `10042`
            and `ТП-4` are both valid. Unique across the network.
          example: '10042'
        name:
          type: string
        address:
          type: string
        city_id:
          type: string
          format: uuid
        location:
          $ref: '#/components/schemas/GeoPoint'
        working_hours:
          type: [string, 'null']
          example: '08:00–20:00'
        status:
          $ref: '#/components/schemas/PostamatStatus'

    PostamatListItem:
      allOf:
        - $ref: '#/components/schemas/Postamat'
        - type: object
          properties:
            distance_m:
              type: [integer, 'null']
              description: Null unless `near_lat`/`near_lon` were supplied.
            free_cell_count:
              type: integer

    PostamatDetails:
      allOf:
        - $ref: '#/components/schemas/Postamat'
        - type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'
            free_cell_count:
              type: integer
            total_cell_count:
              type: integer

    AdminPostamatListItem:
      allOf:
        - $ref: '#/components/schemas/Postamat'
        - type: object
          required: [occupied_cell_count, total_cell_count]
          properties:
            occupied_cell_count:
              type: integer
            total_cell_count:
              type: integer
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'

    AdminPostamatDetails:
      allOf:
        - $ref: '#/components/schemas/AdminPostamatListItem'
        - type: object
          properties:
            device:
              oneOf:
                - $ref: '#/components/schemas/Device'
                - type: 'null'
            grid_rows:
              type: [integer, 'null']
            grid_cols:
              type: [integer, 'null']
            blocked_reason:
              type: [string, 'null']
            created_at:
              $ref: '#/components/schemas/Timestamp'
            updated_at:
              $ref: '#/components/schemas/Timestamp'

    PostamatWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        number:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 500
        city_id:
          type: string
          format: uuid
        location:
          $ref: '#/components/schemas/GeoPoint'
        working_hours:
          type: [string, 'null']
        grid_rows:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        grid_cols:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        device:
          type: [object, 'null']
          description: |
            Convenience passthrough — the admin form edits IP and MAC inline even
            though the device is its own resource.
          properties:
            ip_address:
              type: [string, 'null']
              example: 192.168.1.155
            mac_address:
              type: [string, 'null']
              pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
              example: 00:1A:2B:3C:4D:5E

    PostamatSchedule:
      type: object
      required: [round_the_clock]
      properties:
        round_the_clock:
          type: boolean
          description: |
            True for a cabinet standing in a 24/7 lobby. When true, `days` is ignored.
        days:
          type: array
          description: |
            One entry per weekday the site is open. Missing weekdays mean closed.
            A postamat inside a post office inherits that office's hours.
          items:
            type: object
            required: [weekday, opens_at, closes_at]
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 = Monday.
              opens_at:
                type: string
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                example: '08:00'
              closes_at:
                type: string
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                example: '20:00'
      example:
        round_the_clock: false
        days:
          - { weekday: 1, opens_at: '08:00', closes_at: '20:00' }
          - { weekday: 2, opens_at: '08:00', closes_at: '20:00' }

    CustodyRecord:
      type: object
      description: |
        A parcel taken out of a cell and held at the counter. Freeing a cell is a
        procedure, not a button: staff open it with a stated reason, remove the parcel,
        **photograph it**, describe it, and only then does the cell become free.

        Without this record a removed parcel simply vanishes from the system and no
        dispute can be answered afterwards.
      required: [id, booking_id, removed_at, removed_by, photo_url, description, status]
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        postamat_id:
          type: string
          format: uuid
        cell_number:
          type: string
        removed_at:
          $ref: '#/components/schemas/Timestamp'
        removed_by:
          type: string
          description: Login of the staff member who filed the act.
        reason:
          type: string
        photo_url:
          type: string
          format: uri
          description: Mandatory. A removal act without a photograph is not an act.
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [at_counter, handed_over, returned_to_sender, disposed]
        handovers:
          type: array
          items:
            type: object
            required: [at, to, by]
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              to:
                type: string
                description: 'Who took it: `recipient`, `sender`, or a free-text note.'
              by:
                type: string
                description: Staff login.
              document_ref:
                type: [string, 'null']
        disposal_due_at:
          type: [string, 'null']
          format: date-time
          description: |
            When an uncollected parcel is returned to the sender or disposed of.
            Configuration; 30 days by default.

    Photo:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
        uploaded_at:
          $ref: '#/components/schemas/Timestamp'

    Device:
      type: object
      description: |
        The Raspberry Pi in the cabinet. Kept as its own resource even though the
        admin screens only surface IP and MAC today.
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        postamat_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [online, offline, degraded]
        ip_address:
          type: [string, 'null']
        mac_address:
          type: [string, 'null']
        os_version:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        last_seen_at:
          type: [string, 'null']
          format: date-time
        certificate_expires_at:
          type: [string, 'null']
          format: date-time
        on_battery:
          type: [boolean, 'null']
          description: Running on UPS.
        tamper_detected:
          type: [boolean, 'null']
        jammed_cell_ids:
          type: array
          items:
            type: string
            format: uuid

    # ── cells ─────────────────────────────────────────────────────────────

    CellStatus:
      type: string
      description: |
        Five states.

        * `free` — available.
        * `booked` — paid for, parcel not inside yet.
        * `occupied` — parcel inside, awaiting collection.
        * `blocked` — an operator's decision, and only that. Failed PIN attempts
          cannot produce it: a wrong code matches no cell, so there is nothing to
          block. What locks out is the terminal.
        * `maintenance` — planned work. Deliberately not the same thing as `blocked`.
      enum: [free, booked, occupied, blocked, maintenance]

    CellType:
      type: object
      required: [id, code, name, width_mm, height_mm, depth_mm, is_active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: small
        name:
          type: string
          example: Маленький
        width_mm:
          type: integer
        height_mm:
          type: integer
        depth_mm:
          type: integer
        is_active:
          type: boolean

    AdminCellType:
      allOf:
        - $ref: '#/components/schemas/CellType'
        - type: object
          properties:
            cell_count:
              type: integer
            blocked_at:
              type: [string, 'null']
              format: date-time

    Tariff:
      type: object
      description: |
        Price for one cell type, in one city, for one duration. The price lives on the
        pair city × cell type rather than on the cell type alone — Aşgabat and Arkadag
        may charge differently for the same drawer.
      required: [city_id, cell_type_id, duration_hours, price]
      properties:
        city_id:
          type: string
          format: uuid
        cell_type_id:
          type: string
          format: uuid
        duration_hours:
          $ref: '#/components/schemas/DurationHours'
        price:
          $ref: '#/components/schemas/Money'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    CellTypeWrite:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 100
        width_mm:
          type: integer
          minimum: 1
        height_mm:
          type: integer
          minimum: 1
        depth_mm:
          type: integer
          minimum: 1

    Cell:
      type: object
      required: [id, postamat_id, number, cell_type_id]
      properties:
        id:
          type: string
          format: uuid
        postamat_id:
          type: string
          format: uuid
        number:
          type: string
          description: |
            The label on the door: a plain number, `1`–`42` in the pilot cabinet.
            Unique **within its postamat**, not across the network. Not the primary
            key and not the grid position.
          example: '14'
        row:
          type: [integer, 'null']
        col:
          type: [integer, 'null']
        row_span:
          type: [integer, 'null']
        col_span:
          type: [integer, 'null']
        hardware_address:
          oneOf:
            - $ref: '#/components/schemas/HardwareAddress'
            - type: 'null'
        cell_type_id:
          type: string
          format: uuid

    CellWrite:
      type: object
      properties:
        postamat_id:
          type: string
          format: uuid
        number:
          type: string
          maxLength: 16
        row:
          type: [integer, 'null']
          minimum: 1
        col:
          type: [integer, 'null']
          minimum: 1
        row_span:
          type: [integer, 'null']
          minimum: 1
        col_span:
          type: [integer, 'null']
          minimum: 1
        hardware_address:
          oneOf:
            - $ref: '#/components/schemas/HardwareAddress'
            - type: 'null'
        cell_type_id:
          type: string
          format: uuid

    CellWithState:
      allOf:
        - $ref: '#/components/schemas/Cell'
        - type: object
          required: [status]
          properties:
            status:
              $ref: '#/components/schemas/CellStatus'
            cell_type:
              $ref: '#/components/schemas/CellType'
            postamat_number:
              type: string
            postamat_address:
              type: string
            held_by:
              type: [object, 'null']
              description: Who is holding this cell right now. Null when `free`.
              properties:
                booking_id:
                  type: string
                  format: uuid
                client_id:
                  type: string
                  format: uuid
                client_phone:
                  $ref: '#/components/schemas/Phone'
                expires_at:
                  $ref: '#/components/schemas/Timestamp'
            status_reason:
              type: [string, 'null']
            status_changed_at:
              $ref: '#/components/schemas/Timestamp'
            door_open:
              type: [boolean, 'null']

    # ── bookings ──────────────────────────────────────────────────────

    BookingStatus:
      type: string
      description: |
        Main line:

        * `pending_payment` — cell held, the hold clock is running (10 minutes by
          default; a server setting, not a constant).
        * `awaiting_deposit` — paid, cell assigned, waiting for the parcel to go in.
        * `awaiting_pickup` — parcel inside, pickup code sent by SMS.
        * `completed` — collected, cell free again.

        Overdue branch. Every interval below is configuration:

        * `expired` — the paid period ran out. **The codes still work and the cell is
          still held.** Nothing punitive happens at this moment.
        * `grace` — free collection continues, reminders get more frequent. For a
          postamat that is not round-the-clock the grace runs to opening + 2 h, because
          the person could not physically have come.
        * `overdue` — grace is over; the booking enters the operator work queue.
        * `to_remove` — staff have been told to go and pull it. The queue has to tell
          this apart from `overdue`, which is merely late.
        * `removed` — staff opened the cell, took the parcel out, photographed it and
          filed a custody record. Only then is the cell free.
        * `closed` — the parcel left custody: handed over, returned or disposed of.

        Dead ends:

        * `cancelled` — cancelled before the parcel arrived. No refund.
        * `payment_failed` — the hold died without a successful payment.

        No storage fees are charged at any stage.
      enum:
        - pending_payment
        - awaiting_deposit
        - awaiting_pickup
        - completed
        - expired
        - grace
        - overdue
        - to_remove
        - removed
        - closed
        - cancelled
        - payment_failed

    BookingListItem:
      type: object
      required: [id, status, postamat_name, cell_number, cell_type_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BookingStatus'
        postamat_id:
          type: string
          format: uuid
        postamat_name:
          type: string
          example: ТП #4 Беркарарлык
        cell_number:
          type: string
          example: '14'
        cell_type_name:
          type: string
          example: Маленький
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          type: [string, 'null']
          format: date-time

    Booking:
      allOf:
        - $ref: '#/components/schemas/BookingListItem'
        - type: object
          properties:
            postamat_address:
              type: string
            cell_id:
              type: string
              format: uuid
            duration_hours:
              $ref: '#/components/schemas/DurationHours'
            price:
              $ref: '#/components/schemas/Money'
            recipient_phone:
              oneOf:
                - $ref: '#/components/schemas/Phone'
                - type: 'null'
            recipient_name:
              type: [string, 'null']
            deposited_by:
              type: string
              enum: [owner, courier]
              description: |
                Defaults to `owner` when omitted on creation.
                Who puts the parcel in. `owner` is the «Пропустить» path on screen
                `262:3414`. There is no separate shipment object — a courier delivery
                is this flag plus `courier_phone`, which is what the mockups actually draw.
            courier_phone:
              oneOf:
                - $ref: '#/components/schemas/Phone'
                - type: 'null'
              description: Where the deposit code was sent. Null when `deposited_by` is `owner`.
            hold_expires_at:
              type: [string, 'null']
              format: date-time
              description: |
                When the 10-minute payment hold dies. Null once paid. The summary
                screen counts down against this.
            deposit_code:
              oneOf:
                - $ref: '#/components/schemas/Pin'
                - type: 'null'
              description: |
                Grant #1, the only code ever returned to the sender — and only in the
                response that **issues** it: booking creation and
                `POST /bookings/{id}/deposit-code/rotate`. Every other read returns
                `null`, because the server keeps a keyed hash and genuinely cannot
                produce the digits again.

                A client that needs to show the code later must have cached it. When it
                cannot, the user rotates: a fresh code is issued and the old one dies.
            pickup_code_sent_at:
              type: [string, 'null']
              format: date-time
              description: |
                When the pickup code last went out by SMS. The digits are not here —
                they appear only in the response that issues them, and only to the
                booking's owner.
            qr_payload:
              type: [string, 'null']
              description: Opaque payload for the booking QR shown in the app.
            payment:
              oneOf:
                - $ref: '#/components/schemas/Payment'
                - type: 'null'
            cached_at:
              $ref: '#/components/schemas/Timestamp'
              description: |
                Server time when this payload was produced. The app stores it with the
                offline copy and shows «данные на такое-то время» when there is no network.

    AdminBookingListItem:
      allOf:
        - $ref: '#/components/schemas/BookingListItem'
        - type: object
          properties:
            client_id:
              type: string
              format: uuid
            client_phone:
              $ref: '#/components/schemas/Phone'
            cell_type_code:
              type: string

    TimelineStep:
      type: object
      required: [step, occurred_at]
      properties:
        step:
          type: string
          enum:
            - booked
            - paid
            - parcel_deposited
            - pickup_code_sent
            - collected
            - expired
            - cancelled
        occurred_at:
          type: [string, 'null']
          format: date-time
          description: Null means the step has not happened — render it greyed out.
        actor:
          type: [string, 'null']
          description: 'Who caused it: `client`, `courier`, `staff`, `system`.'

    # ── payments ──────────────────────────────────────────────────────────

    PaymentStatus:
      type: string
      enum: [pending, authorized, succeeded, failed, cancelled, expired]

    Payment:
      type: object
      required: [id, booking_id, status, amount, bank_code, created_at]
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        bank_code:
          $ref: '#/components/schemas/BankCode'
        redirect_url:
          type: [string, 'null']
          format: uri
          description: |
            The acquirer's hosted page. Present while `pending`. Card data is entered
            there and never travels through this API.
        expires_at:
          type: [string, 'null']
          format: date-time
        failure_code:
          type: [string, 'null']
          description: |
            Acquirer decline reason, mapped to one of `PAYMENT_DECLINED`,
            `PAYMENT_CANCELLED`, `PAYMENT_EXPIRED`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        paid_at:
          type: [string, 'null']
          format: date-time

    ExpiredParcel:
      type: object
      required: [booking_id, cell_number, expired_at]
      properties:
        booking_id:
          type: string
          format: uuid
        cell_id:
          type: string
          format: uuid
        cell_number:
          type: string
        recipient_phone:
          $ref: '#/components/schemas/Phone'
        expired_at:
          $ref: '#/components/schemas/Timestamp'
        days_overdue:
          type: integer

    # ── kiosk ─────────────────────────────────────────────────────────────

    KioskSession:
      type: object
      required: [id, status, cell, grant_kind, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [verified, opening, open, awaiting_door, completed, failed, cancelled]
        cell:
          $ref: '#/components/schemas/Cell'
        grant_kind:
          type: string
          enum: [deposit, pickup]
        booking_id:
          type: string
          format: uuid
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        opened_at:
          type: [string, 'null']
          format: date-time
        door_closed_at:
          type: [string, 'null']
          format: date-time

    QrSession:
      type: object
      required: [id, status, qr_payload, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, expired, cancelled]
        qr_payload:
          type: string
          description: Rendered as a QR code on the terminal.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        kiosk_session:
          oneOf:
            - $ref: '#/components/schemas/KioskSession'
            - type: 'null'
          description: Present once `confirmed` — carry on exactly as after a PIN.

    # ── audit and realtime ────────────────────────────────────────────────

    AuditEventType:
      type: string
      description: |
        Open-ended by design — new event types will appear without a version bump.
        Clients must render unknown types as raw text rather than crashing.
      examples:
        - cell.opened
        - cell.door_closed
        - cell.blocked
        - cell.unblocked
        - cell.status_changed
        - cell.remote_opened
        - pin.failed
        - pin.attempts_exceeded
        - booking.created
        - booking.paid
        - booking.cancelled
        - parcel.deposited
        - parcel.collected
        - parcel.unloaded
        - client.blocked
        - client.unblocked
        - postamat.blocked
        - device.offline
        - device.online
        - device.tamper
        - lock_agent.error
        - system.sync_completed

    AuditLogEntry:
      type: object
      required: [id, occurred_at, source, event_type, message]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
          enum: [system, admin, staff, device, api]
        actor_id:
          type: [string, 'null']
          format: uuid
        actor_label:
          type: [string, 'null']
          description: 'What the table shows: `admin_ivanov`, `Система`, `Сервер API`.'
        event_type:
          $ref: '#/components/schemas/AuditEventType'
        severity:
          type: string
          enum: [info, warning, error]
          description: Defaults to `info`.
        message:
          type: string
          description: English. The panel translates by `event_type`, not by this string.
        postamat_id:
          type: [string, 'null']
          format: uuid
        postamat_number:
          type: [string, 'null']
        cell_id:
          type: [string, 'null']
          format: uuid
        cell_number:
          type: [string, 'null']
        booking_id:
          type: [string, 'null']
          format: uuid
        reason:
          type: [string, 'null']
          description: Mandatory for remote opens and unblocks; null elsewhere.
        details:
          type: [object, 'null']
          additionalProperties: true
        trace_id:
          type: [string, 'null']

    RealtimeEventType:
      type: string
      enum:
        - cell.status_changed
        - cell.door_opened
        - cell.door_closed
        - booking.created
        - booking.status_changed
        - device.presence_changed
        - device.alert
        - audit.entry_created

    RealtimeEvent:
      type: object
      required: [id, type, occurred_at, payload]
      properties:
        id:
          type: string
          description: Use as `last_event_id` when resuming.
        type:
          $ref: '#/components/schemas/RealtimeEventType'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        payload:
          type: object
          additionalProperties: true

    # ── kiosk ↔ lock agent (local WebSocket, not HTTP) ─────────────────────

    LockAgentCommand:
      type: object
      description: |
        Sent by the kiosk UI to the local lock agent over `ws://127.0.0.1:8765`.
        Not part of the HTTP API — defined here so both the kiosk and the TypeScript
        mock generate from the same types. See `docs/API-01.md`.
      required: [id, command]
      properties:
        id:
          type: string
          format: uuid
        command:
          type: string
          enum: [open, status, diagnostics, ping]
        cell_id:
          type: [string, 'null']
          format: uuid
        hardware_address:
          oneOf:
            - $ref: '#/components/schemas/HardwareAddress'
            - type: 'null'
        timeout_ms:
          type: integer
          default: 5000

    LockAgentEvent:
      type: object
      description: Sent by the lock agent to the kiosk UI.
      required: [type, occurred_at]
      properties:
        type:
          type: string
          enum:
            - ack
            - opened
            - open_failed
            - door_opened
            - door_closed
            - door_timeout
            - sensor_fault
            - jammed
            - tamper
            - power_state
            - agent_ready
            - pong
        command_id:
          type: [string, 'null']
          format: uuid
        cell_id:
          type: [string, 'null']
          format: uuid
        hardware_address:
          oneOf:
            - $ref: '#/components/schemas/HardwareAddress'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        error_code:
          type: [string, 'null']
          enum:
            - LOCK_NOT_RESPONDING
            - LOCK_JAMMED
            - SENSOR_FAULT
            - BOARD_UNREACHABLE
            - INVALID_ADDRESS
            - null
        details:
          type: [object, 'null']
          additionalProperties: true
